name: Android TV Browser Build

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Forráskód letöltése
      uses: actions/checkout@v4

    - name: Java JDK 17 beállítása
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Hibajavítás - Futtatási jog kényszerítése és fordítás
      run: |
        cd AndroidTV_Browser_ExoPlayer_2GB_RAM
        # Közvetlenül a bash-el hívjuk meg a gradle-t, így a hiányzó chmod jog nem tudja megállítani!
        bash gradlew assembleDebug

    - name: A kész APK fájl kimentése
      uses: actions/artifacts@v4
      with:
        name: tv-browser-apk
        path: "**/build/outputs/apk/debug/*.apk"
