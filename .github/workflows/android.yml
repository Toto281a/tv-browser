name: Android TV Browser Build

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Forráskód letöltése
      uses: actions/checkout@v4

    - name: Java JDK 17 beállítása
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Friss, globális Gradle motor telepítése a felhőbe (Kiváltja a hiányzó fájlokat)
    - name: Globális Gradle telepítése
      uses: gradle/actions/setup-gradle@v4

    - name: APK megépítése globális motorral
      working-directory: AndroidTV_Browser_ExoPlayer_2GB_RAM
      # Nem a helyi ./gradlew-t hívjuk, hanem a felhőbe frissen felrakott "gradle" parancsot!
      run: gradle assembleDebug

    - name: A kész APK fájl kimentése
      uses: actions/artifacts@v4
      with:
        name: tv-browser-apk
        path: "AndroidTV_Browser_ExoPlayer_2GB_RAM/app/build/outputs/apk/debug/*.apk"
