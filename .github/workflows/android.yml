name: Android TV Browser Build

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Forráskód letöltése
      uses: actions/checkout@v4

    - name: Java JDK 17 beállítása
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle környezet előkészítése
      uses: gradle/actions/setup-gradle@v4

    - name: Futtatási jog kényszerítése és APK megépítése
      # A working-directory sor kényszeríti a Linuxot, hogy a te mappádban dolgozzon
      working-directory: AndroidTV_Browser_ExoPlayer_2GB_RAM
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug

    - name: A kész APK fájl kimentése
      uses: actions/artifacts@v4
      with:
        name: tv-browser-apk
        path: "AndroidTV_Browser_ExoPlayer_2GB_RAM/app/build/outputs/apk/debug/*.apk"
