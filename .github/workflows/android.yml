name: Android TV Browser Build

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Forráskód letöltése
      uses: actions/checkout@v4

    - name: Java JDK 17 beállítása
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # A hivatalos Google/Gradle automatizáció, ami megkeresi a belső mappát és lefordítja
    - name: APK megépítése hivatalos motorral
      uses: gradle/actions/setup-gradle@v4
      with:
        arguments: assembleDebug
        build-root-directory: AndroidTV_Browser_ExoPlayer_2GB_RAM

    - name: A kész APK fájl kimentése
      uses: actions/artifacts@v4
      with:
        name: tv-browser-apk
        path: "**/build/outputs/apk/debug/*.apk"
